spring:
  application:
    name: sns-app
  datasource:
    url: jdbc:postgresql://localhost:5432/snsdb
    username: snsuser
    password: snspassword
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
management:
  metrics:
    tags:
      application: sns-app
  health:
    db:
      enabled: false
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service_name: "${spring.application.name}"
rustfs:
  endpoint: http://localhost:9000
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: media
  region: ap-northeast-2
  presigned-url-expiration-seconds: 3600
